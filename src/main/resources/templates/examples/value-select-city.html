<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="city-field" th:fragment="cityField(oob)"
     th:attr="hx-swap-oob=${oob ? 'outerHTML' : null}">
  <label for="city-select">市区町村</label>
  <select id="city-select" name="cityId" th:disabled="${#lists.isEmpty(cities)}"
          th:attr="aria-invalid=${cityError != null}" aria-describedby="city-error">
    <option value="" th:selected="${selectedCityId == ''}">選択してください</option>
    <option th:each="city : ${cities}" th:value="${city.id}"
            th:text="${city.name}" th:selected="${city.id == selectedCityId}"></option>
  </select>
  <p id="city-error" class="field-error" role="status" th:text="${cityError}"></p>
</div>

<th:block th:fragment="cityResponse">
  <th:block th:replace="~{examples/value-select-city :: cityField(false)}"></th:block>
  <th:block th:if="${prefectureError != null}">
    <th:block th:replace="~{examples/value-select-prefecture :: prefectureField(true)}"></th:block>
  </th:block>
  <th:block th:replace="~{examples/value-select-result :: selectionResult(true)}"></th:block>
</th:block>
</body>
</html>
