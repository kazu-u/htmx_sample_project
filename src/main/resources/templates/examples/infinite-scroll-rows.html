<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="pageRows">
  <tr th:each="book : ${books}" th:attr="data-book-id=${book.id}">
    <th scope="row" th:text="${book.title}"></th>
    <td th:text="${book.category}"></td>
  </tr>
  <tr id="scroll-more" th:if="${hasMore}">
    <td colspan="2">
      <form method="get" th:action="@{/examples/infinite-scroll}"
            th:attr="hx-get=@{/examples/infinite-scroll}"
            hx-trigger="intersect once root:#scroll-window, submit"
            hx-target="closest tr" hx-swap="outerHTML" hx-sync="closest tbody:drop"
            hx-disabled-elt="find button" hx-indicator="#loading">
        <input type="hidden" name="page" th:value="${nextPage}">
        <button type="submit">続きを読み込む・再試行する</button>
      </form>
    </td>
  </tr>
  <tr id="scroll-end" th:unless="${hasMore}" tabindex="-1">
    <td colspan="2">全9件を表示しました。これ以上の取得はありません。</td>
  </tr>
</th:block>
</body>
</html>
