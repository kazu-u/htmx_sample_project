<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="progressPanel">
  <section id="progress-panel" data-request-region aria-labelledby="job-title">
    <h2 id="job-title">模擬ジョブの進捗</h2>
    <th:block th:replace="~{examples/progress-state :: progressState}"></th:block>
    <div id="job-controls" th:replace="~{examples/progress-panel :: jobControls(false)}"></div>
    <a id="progress-refresh" th:href="@{/examples/progress-bar/progress(includeControls=true)}"
       th:attr="hx-get=@{/examples/progress-bar/progress(includeControls=true)}"
       hx-target="#progress-state" hx-swap="outerHTML" hx-sync="#progress-panel:drop">
      進捗を手動で取得・再試行する
    </a>
  </section>
</th:block>

<div id="job-controls" th:fragment="jobControls(oob)"
     th:attr="hx-swap-oob=${oob ? 'outerHTML' : null}">
    <div th:if="${job.status.name() == 'IDLE' or job.status.name() == 'COMPLETED'
                    or job.status.name() == 'FAILED' or job.status.name() == 'CANCELLED'}">
      <form method="post" th:action="@{/examples/progress-bar/start}"
            th:attr="hx-post=@{/examples/progress-bar/start}"
            hx-target="#progress-panel" hx-swap="outerHTML" hx-sync="#progress-panel:replace"
            hx-disabled-elt="global .progress-start-button" hx-indicator="#loading">
        <button id="start-success-button" class="progress-start-button" type="submit" name="outcome" value="SUCCESS">成功する処理を開始</button>
        <button id="start-failure-button" class="progress-start-button" type="submit" name="outcome" value="FAILURE">失敗する処理を開始</button>
      </form>
    </div>
    <form th:if="${job.status.running()}" method="post" th:action="@{/examples/progress-bar/cancel}"
          th:attr="hx-post=@{/examples/progress-bar/cancel}"
          hx-target="#progress-panel" hx-swap="outerHTML" hx-sync="#progress-panel:replace"
          hx-disabled-elt="find button" hx-indicator="#loading">
      <button id="cancel-job-button" type="submit">処理をキャンセル</button>
    </form>
</div>
</body>
</html>
